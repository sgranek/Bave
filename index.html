<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap');
  :root{
    --bg-top:#CFE8F5;
    --bg-bottom:#F7FBFD;
    --ink:#22252B;
    --ink-soft:#63666D;
    --ink-faint:#9C978A;
    --line:#D8D1BE;
    --card:#FDFCF9;
    --sage:#6E7C66;
    --sage-deep:#49543F;
    --ground:#EFEAE0;
    --logo-dot:#BFE0F2;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:'Inter',system-ui,sans-serif;
    background:linear-gradient(to bottom, var(--bg-top) 0%, var(--bg-bottom) 75%);
  }

  .scene{
    position:relative;
    width:100vw;
    height:100vh;
  }

  /* Logo (icon + wordmark, moves as one unit) */
  .logo{
    position:absolute;
    top:0;
    left:0;
    display:flex;
    align-items:center;
    gap:10px;
    user-select:none;
    cursor:pointer;
    touch-action:none;
    z-index:60;
    will-change:transform;
  }
  .logo-house{ width:44px; height:44px; flex:0 0 auto; }
  .logo-house svg{ width:100%; height:100%; display:block; }
  .logo-text{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:58px;
    color:var(--ink);
    letter-spacing:-1px;
    transition:filter 0.2s ease;
  }
  .logo.bump .logo-text{ animation:bump 0.3s ease-out; }
  @keyframes bump{
    35%{ filter:brightness(0.94); }
    100%{ filter:brightness(1); }
  }

  /* Ground strip where neighborhoods live */
  .ground{
    position:absolute;
    left:0;
    right:0;
    bottom:78px;
    height:120px;
    background:transparent;
    display:flex;
    align-items:center;
    gap:14px;
    padding:0 26px;
    overflow-x:auto;
    overflow-y:hidden;
    pointer-events:none;
  }
  .ground::-webkit-scrollbar{ height:0; }

  .neighborhood{
    flex:0 0 auto;
    background:var(--card);
    border:1px solid var(--line);
    padding:10px 16px;
    box-shadow:0 1px 3px rgba(34,37,43,0.05);
    display:flex;
    align-items:center;
    gap:10px;
    animation:pop 0.4s cubic-bezier(.22,1,.36,1);
  }

  /* Plaza cluster: square with a house on each cardinal side */
  .plaza-cluster{
    display:grid;
    grid-template-columns:16px 32px 16px;
    grid-template-rows:16px 32px 16px;
    gap:3px;
    align-items:center;
    justify-items:center;
  }
  .plaza-cluster svg{ width:16px; height:16px; display:block; }
  .pos-top{ grid-column:2; grid-row:1; }
  .pos-left{ grid-column:1; grid-row:2; }
  .pos-right{ grid-column:3; grid-row:2; }
  .pos-bottom{ grid-column:2; grid-row:3; }
  .plaza{
    grid-column:2; grid-row:2;
    width:32px;
    height:32px;
    border:1px solid var(--sage);
    background:var(--card);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .plaza svg{ width:18px; height:18px; }

  /* Street: 3 houses each side of the road */
  .street-block{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:0;
  }
  .houses-side{
    display:flex;
    gap:3px;
  }
  .houses-side svg{ width:16px; height:16px; display:block; }
  .houses-side.bottom svg{ transform:scaleY(-1); }
  .road-svg{ width:66px; height:16px; display:block; }

  @keyframes pop{
    0%{ transform:scale(0.85); opacity:0; }
    100%{ transform:scale(1); opacity:1; }
  }

  /* Falling houses */
  .house{
    position:absolute;
    width:54px;
    height:54px;
    z-index:20;
    filter:drop-shadow(0 3px 4px rgba(34,37,43,0.10));
    transition:top 0.6s cubic-bezier(.4,0,.2,1), transform 0.6s cubic-bezier(.4,0,.2,1);
  }
  .house svg{ width:100%; height:100%; display:block; }
  .house.draggable{ cursor:grab; touch-action:none; }
  .house.draggable.dragging{ cursor:grabbing; z-index:35; filter:drop-shadow(0 6px 10px rgba(34,37,43,0.2)); }

  .landing-pulse{
    position:absolute;
    bottom:142px;
    width:44px;
    height:44px;
    margin-left:-6px;
    margin-bottom:-16px;
    border-radius:50%;
    border:1px solid var(--ink-faint);
    animation:pulse 0.55s ease-out forwards;
    z-index:15;
  }
  @keyframes pulse{
    0%{ transform:scale(0.35); opacity:0.7; }
    100%{ transform:scale(1.15); opacity:0; }
  }

  /* World corner */
  .world-corner{
    position:absolute;
    top:20px;
    right:20px;
    display:flex;
    flex-direction:column-reverse;
    gap:10px;
    z-index:45;
    align-items:flex-end;
  }
  .world{
    width:52px;
    height:52px;
    border-radius:50%;
    background:transparent;
    border:1.5px solid var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    animation:pop 0.45s cubic-bezier(.22,1,.36,1), worldFloat 3.6s ease-in-out infinite;
    text-decoration:none;
    box-shadow:0 3px 10px rgba(34,37,43,0.14);
    overflow:hidden;
    transition:filter 0.3s ease, border-color 0.3s ease;
  }
  .world svg{ width:34px; height:34px; }
  .world:hover{ box-shadow:0 4px 14px rgba(34,37,43,0.2); }
  .world.viewed{
    filter:grayscale(1) opacity(55%);
    border-color:var(--ink-faint);
  }
  @keyframes worldFloat{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-3px); }
  }
  .world .spin{
    transform-box:fill-box;
    transform-origin:center;
    animation:worldSpin 28s linear infinite;
  }
  .world .orbit{
    transform-box:fill-box;
    transform-origin:center;
    animation:worldSpin 8s linear infinite;
  }
  @keyframes worldSpin{ to{ transform:rotate(360deg); } }

  /* Reset button */
  .reset-btn{
    position:absolute;
    bottom:52px;
    right:20px;
    z-index:50;
    font-family:'Inter',sans-serif;
    font-size:12px;
    font-weight:500;
    color:var(--ink-soft);
    background:var(--card);
    border:1px solid var(--line);
    padding:8px 15px;
    cursor:pointer;
  }
  .reset-btn:hover{ border-color:var(--ink-soft); color:var(--ink); }

  .tagline{
    position:absolute;
    top:22px;
    left:24px;
    font-family:'Inter',sans-serif;
    font-size:12px;
    color:var(--ink-soft);
    letter-spacing:0.3px;
    z-index:10;
  }

  .footer{
    position:absolute;
    bottom:18px;
    left:0;
    right:0;
    text-align:center;
    font-family:'Inter',sans-serif;
    font-size:11px;
    color:var(--ink-faint);
    letter-spacing:0.4px;
    z-index:10;
    pointer-events:none;
  }

  /* Sound toggle + hidden stats, bottom-left */
  .sound-toggle{
    position:absolute;
    bottom:52px;
    left:24px;
    width:32px;
    height:32px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--card);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:50;
    opacity:0.55;
    transition:opacity 0.2s ease, border-color 0.2s ease;
  }
  .sound-toggle:hover{ opacity:0.9; }
  .sound-toggle.on{ opacity:0.85; border-color:var(--ink-soft); }
  .sound-toggle svg{ width:15px; height:15px; }

  .stats-hidden{
    position:absolute;
    bottom:18px;
    left:24px;
    font-family:'Inter',sans-serif;
    font-size:10px;
    color:var(--ink-faint);
    opacity:0.5;
    letter-spacing:0.2px;
    z-index:10;
    pointer-events:none;
  }

  .info-backdrop{
    position:absolute;
    inset:0;
    background:rgba(34,37,43,0.28);
    z-index:99;
    display:none;
  }
  .info-backdrop.show{ display:block; }

  .info-panel{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:280px;
    background:var(--card);
    border:1px solid var(--line);
    padding:26px 28px;
    box-shadow:0 10px 34px rgba(34,37,43,0.2);
    z-index:100;
    display:none;
  }
  .info-panel.show{ display:block; }
  .info-panel h3{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:20px;
    color:var(--ink);
    margin:0 0 10px;
  }
  .info-panel p{
    font-family:'Inter',sans-serif;
    font-size:13px;
    line-height:1.55;
    color:var(--ink-soft);
    margin:0 0 18px;
  }
  .close-btn{
    font-family:'Inter',sans-serif;
    font-size:12px;
    font-weight:500;
    color:var(--ink-soft);
    background:var(--card);
    border:1px solid var(--line);
    padding:8px 15px;
    cursor:pointer;
  }
  .close-btn:hover{ border-color:var(--ink-soft); color:var(--ink); }

  .chai-overlay{
    position:fixed;
    inset:0;
    background:rgba(247,244,236,0.88);
    z-index:140;
    display:none;
    align-items:center;
    justify-content:center;
    animation:chaiFade 0.8s ease;
  }
  .chai-overlay.show{ display:flex; }
  @keyframes chaiFade{
    0%{ opacity:0; }
    100%{ opacity:1; }
  }
  .chai-text{
    font-size:min(28vw, 220px);
    font-weight:700;
    color:var(--ink);
    text-shadow:0 0 50px rgba(143,185,214,0.7);
    line-height:1;
  }
</style>
</head>
<body>

<div class="scene" id="scene">

  <div class="tagline">catch me if you can</div>

  <div class="logo" id="logo">
    <div class="logo-house">
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 32 L32 8 L56 32 L56 60 L8 60 Z" fill="none" stroke="#22252B" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
        <path d="M25 60 L25 38 L39 38 L39 60" fill="none" stroke="#22252B" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
        <circle cx="46" cy="18" r="6.5" fill="#BFE0F2"/>
      </svg>
    </div>
    <span class="logo-text">bave</span>
  </div>

  <div class="world-corner" id="worldCorner"></div>

  <div class="ground" id="ground"></div>

    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

      <circle cx="7" cy="17" r="2.4" fill="none" stroke="var(--ink)" stroke-width="1.4"/>
      <circle cx="17" cy="15" r="2.4" fill="none" stroke="var(--ink)" stroke-width="1.4"/>
    </svg>
  </div>
  <div class="stats-hidden" id="statsHidden">0 properties &middot; 0 neighborhoods &middot; 0 worlds</div>

  <div class="footer">All rights reserved to Lu</div>
  <button class="reset-btn" id="resetBtn">Start over</button>

  <div class="info-backdrop" id="infoBackdrop"></div>
  <div class="info-panel" id="infoPanel">
    <h3 id="infoTitle">World 1</h3>
    <p id="infoText">bave turns everyday clicks into little towns.</p>
    <button class="close-btn" id="infoClose">Close</button>
  </div>

  <div class="chai-overlay" id="chaiOverlay">
    <div class="chai-text">חי</div>
  </div>

</div>

<script>
(function(){

  // ---------- Logo: bounce ----------
  var logo = document.getElementById('logo');
  var scene = document.getElementById('scene');
  var lx = 60, ly = 110;
  var speed = 1.6;
  var dx = speed, dy = speed * 0.7;

  function bounceLogo(){
    var w = scene.clientWidth, h = scene.clientHeight;
    var lw = logo.offsetWidth || 190, lh = logo.offsetHeight || 58;

    lx += dx; ly += dy;
    if(lx <= 0){ lx = 0; dx = Math.abs(dx); }
    if(lx + lw >= w){ lx = w - lw; dx = -Math.abs(dx); }
    if(ly <= 0){ ly = 0; dy = Math.abs(dy); }
    if(ly + lh >= h - 160){ ly = h - 160 - lh; dy = -Math.abs(dy); }

    logo.style.transform = 'translate(' + lx + 'px,' + ly + 'px)';
    requestAnimationFrame(bounceLogo);
  }
  requestAnimationFrame(bounceLogo);

  // ---------- Shapes ----------
  function lineHouseSVG(dotColor){
    dotColor = dotColor || 'var(--logo-dot)';
    return '<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">' +
      '<path d="M8 32 L32 8 L56 32 L56 60 L8 60 Z" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<path d="M25 60 L25 38 L39 38 L39 60" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<circle cx="46" cy="18" r="6.5" fill="' + dotColor + '"/>' +
      '</svg>';
  }

  function roadSVG(){
    return '<svg class="road-svg" viewBox="0 0 100 20" xmlns="http://www.w3.org/2000/svg">' +
      '<path d="M2 8 Q50 0 98 8" fill="none" stroke="var(--ink-faint)" stroke-width="2" stroke-linecap="round"/>' +
      '<path d="M2 12 Q50 4 98 12" fill="none" stroke="var(--ink-faint)" stroke-width="0.9" stroke-dasharray="4 4" stroke-linecap="round"/>' +
      '<path d="M2 16 Q50 8 98 16" fill="none" stroke="var(--ink-faint)" stroke-width="2" stroke-linecap="round"/>' +
      '</svg>';
  }

  function plazaSVG(){
    return '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">' +
      '<line x1="12" y1="18" x2="12" y2="9" stroke="var(--sage-deep)" stroke-width="1.2"/>' +
      '<polygon points="12,3 18,12 6,12" fill="none" stroke="var(--sage)" stroke-width="1.2"/>' +
      '<line x1="6" y1="19.5" x2="18" y2="19.5" stroke="var(--sage)" stroke-width="1.2"/>' +
      '</svg>';
  }

  function worldSVG(dotColor, uid){
    dotColor = dotColor || '#C46B6B';
    uid = uid || 'x';
    var gradId = 'oceanGrad' + uid;
    var clipId = 'worldClip' + uid;
    return '<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">' +
      '<defs>' +
        '<radialGradient id="' + gradId + '" cx="35%" cy="30%" r="75%">' +
          '<stop offset="0%" stop-color="#D8ECF6"/>' +
          '<stop offset="55%" stop-color="#8FB9D6"/>' +
          '<stop offset="100%" stop-color="#4E7FA3"/>' +
        '</radialGradient>' +
        '<clipPath id="' + clipId + '"><circle cx="16" cy="16" r="12"/></clipPath>' +
      '</defs>' +
      '<circle cx="16" cy="16" r="12" fill="url(#' + gradId + ')"/>' +
      '<g clip-path="url(#' + clipId + ')" class="spin">' +
        '<path d="M5 10 Q10 5 15 8 Q18 10 16 13 Q13 16 8 14 Q5 13 5 10 Z" fill="#7C9B6E" opacity="0.92"/>' +
        '<path d="M18 5 Q25 6 24 13 Q22 17 17 14 Q15 11 16 8 Q17 6 18 5 Z" fill="#6E8C61" opacity="0.88"/>' +
        '<path d="M9 19 Q15 17 20 21 Q22 25 16 26 Q10 26 8 22 Q7 20 9 19 Z" fill="#7C9B6E" opacity="0.85"/>' +
      '</g>' +
      '<g clip-path="url(#' + clipId + ')" opacity="0.4">' +
        '<ellipse cx="16" cy="16" rx="5.2" ry="12" fill="none" stroke="#FFFFFF" stroke-width="0.7"/>' +
        '<line x1="4" y1="16" x2="28" y2="16" stroke="#FFFFFF" stroke-width="0.6"/>' +
        '<line x1="6" y1="9.5" x2="26" y2="9.5" stroke="#FFFFFF" stroke-width="0.5"/>' +
        '<line x1="6" y1="22.5" x2="26" y2="22.5" stroke="#FFFFFF" stroke-width="0.5"/>' +
      '</g>' +
      '<ellipse cx="12" cy="11" rx="3.4" ry="2.1" fill="#FFFFFF" opacity="0.4"/>' +
      '<circle cx="16" cy="16" r="12" fill="none" stroke="var(--ink)" stroke-width="1.1"/>' +
      '<g class="orbit"><circle cx="29.4" cy="16" r="1.5" fill="' + dotColor + '"/></g>' +
      '</svg>';
  }

  var dotColors = ['#A9793C','#6E9C7C','#7E8CC4','#C46B6B'];

  // ---------- Ambient music ----------
  var audioCtx = null, masterGain = null, filterNode = null, delayNode = null, feedbackGain = null;
  var audioOn = false;
  var stepIndex = 0, stepMs = 450, stepTimer = null;
  var layerOrder = ['bass','melody','shaker','bell'];
  var layersEnabled = { pad:false, bass:false, melody:false, shaker:false, bell:false };

  var chordSets = [
    [261.63,329.63,392.00,493.88],
    [349.23,440.00,523.25,659.25],
    [220.00,261.63,329.63,392.00],
    [392.00,493.88,587.33,698.46]
  ];
  var bassRoots = [130.81,174.61,110.00,196.00];
  var melodyNotes = [523.25,587.33,659.25,783.99,880.00];

  function initAudio(){
    if(audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.0001;
    filterNode = audioCtx.createBiquadFilter();
    filterNode.type = 'lowpass';
    filterNode.frequency.value = 2600;
    delayNode = audioCtx.createDelay();
    delayNode.delayTime.value = 0.32;
    feedbackGain = audioCtx.createGain();
    feedbackGain.gain.value = 0.2;
    delayNode.connect(feedbackGain);
    feedbackGain.connect(delayNode);
    masterGain.connect(filterNode);
    filterNode.connect(audioCtx.destination);
    filterNode.connect(delayNode);
    delayNode.connect(audioCtx.destination);
    layersEnabled.pad = true;
    stepTimer = setInterval(scheduleStep, stepMs);
  }

  function playTone(freq, time, dur, type, peak){
    var osc = audioCtx.createOscillator();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    var g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, time);
    g.gain.linearRampToValueAtTime(peak, time + 0.04);
    g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    osc.connect(g);
    g.connect(masterGain);
    osc.start(time);
    osc.stop(time + dur + 0.05);
  }

  function playNoiseBurst(time, dur, peak){
    var size = Math.max(1, Math.floor(audioCtx.sampleRate * dur));
    var buffer = audioCtx.createBuffer(1, size, audioCtx.sampleRate);
    var data = buffer.getChannelData(0);
    for(var i = 0; i < size; i++){ data[i] = (Math.random() * 2 - 1) * (1 - i / size); }
    var src = audioCtx.createBufferSource();
    src.buffer = buffer;
    var hp = audioCtx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 4500;
    var g = audioCtx.createGain();
    g.gain.setValueAtTime(peak, time);
    g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    src.connect(hp);
    hp.connect(g);
    g.connect(masterGain);
    src.start(time);
  }

  function scheduleStep(){
    var t = audioCtx.currentTime + 0.05;
    if(stepIndex % 8 === 0 && layersEnabled.pad){
      var chord = chordSets[Math.floor(stepIndex / 8) % chordSets.length];
      chord.forEach(function(f){ playTone(f, t, 3.6, 'triangle', 0.045); });
    }
    if(stepIndex % 4 === 0 && layersEnabled.bass){
      var b = bassRoots[Math.floor(stepIndex / 4) % bassRoots.length];
      playTone(b, t, 1.1, 'sine', 0.11);
    }
    if(layersEnabled.melody && Math.random() < 0.5){
      var note = melodyNotes[Math.floor(Math.random() * melodyNotes.length)];
      playTone(note, t, 0.6, 'triangle', 0.04);
    }
    if(layersEnabled.shaker){
      playNoiseBurst(t, 0.08, stepIndex % 2 === 0 ? 0.018 : 0.03);
    }
    if(layersEnabled.bell && stepIndex % 16 === 0){
      var bn = melodyNotes[Math.floor(Math.random() * melodyNotes.length)] * 2;
      playTone(bn, t, 1.4, 'sine', 0.045);
    }
    stepIndex++;
  }

  function flourish(){
    if(!audioCtx) return;
    var t = audioCtx.currentTime + 0.05;
    melodyNotes.forEach(function(f, i){ playTone(f * 2, t + i * 0.09, 0.5, 'sine', 0.05); });
  }

  var soundToggle = document.getElementById('soundToggle');
  soundToggle.addEventListener('click', function(){
    initAudio();
    if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
    audioOn = !audioOn;
    soundToggle.classList.toggle('on', audioOn);
    soundToggle.title = audioOn ? 'Mute music' : 'Play music';
    var target = audioOn ? 0.22 : 0.0001;
    masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
    masterGain.gain.linearRampToValueAtTime(target, audioCtx.currentTime + 0.5);
  });

  function unlockNextInstrument(){
    var idx = neighCount - 1;
    if(idx >= 0 && idx < layerOrder.length){
      layersEnabled[layerOrder[idx]] = true;
    }
    flourish();
  }

  // ---------- State ----------
  var propCount = 0, neighCount = 0, worldCount = 0;
  var ground = document.getElementById('ground');
  var worldCorner = document.getElementById('worldCorner');
  var statsHidden = document.getElementById('statsHidden');
  var currentNeighborhoodHouses = [];
  var currentWorldNeighborhoods = [];

  function updateStats(){
    statsHidden.textContent = propCount + ' properties \u00B7 ' + neighCount + ' neighborhoods \u00B7 ' + worldCount + ' worlds';
  }

  function spawnHouse(originX, originY){
    var house = document.createElement('div');
    house.className = 'house';
    var dot = dotColors[Math.floor(Math.random()*dotColors.length)];
    house.innerHTML = lineHouseSVG(dot);
    var w = scene.clientWidth, h = scene.clientHeight;
    var x = (typeof originX === 'number') ? originX : 40 + Math.random() * (w - 120);
    x = Math.max(10, Math.min(w - 64, x));
    var startY = (typeof originY === 'number') ? originY : 0;
    var groundY = h - 160 - Math.random() * 40;
    var rot = (Math.random() * 16 - 8).toFixed(1);

    house.style.left = x + 'px';
    house.style.top = startY + 'px';
    house.style.transform = 'scale(0.6) rotate(0deg)';
    house.style.opacity = '0';
    scene.appendChild(house);

    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        house.style.opacity = '1';
        house.style.transform = 'scale(1) rotate(' + rot + 'deg)';
        house.style.top = groundY + 'px';
      });
    });

    var landed = false;
    function doLand(){
      if(landed) return;
      landed = true;
      house.removeEventListener('transitionend', onEnd);
      landHouse(house, x);
    }
    function onEnd(e){
      if(e.propertyName !== 'top') return;
      doLand();
    }
    house.addEventListener('transitionend', onEnd);
    setTimeout(doLand, 800);
  }

  var activeDrag = null;

  function makeDraggable(el){
    el.classList.add('draggable');
    var dragging = false, startX, startY, origLeft, origTop, pointerId;

    el.addEventListener('pointerdown', function(e){
      dragging = true;
      pointerId = e.pointerId;
      try{ el.setPointerCapture(pointerId); }catch(err){}
      el.style.transition = 'none';
      el.classList.add('dragging');
      startX = e.clientX; startY = e.clientY;
      origLeft = parseFloat(el.style.left) || 0;
      origTop = parseFloat(el.style.top) || 0;
      activeDrag = { el: el, pointerId: pointerId };
      e.preventDefault();
    });

    el.addEventListener('pointermove', function(e){
      if(!dragging) return;
      var dx = e.clientX - startX, dy = e.clientY - startY;
      el.style.left = (origLeft + dx) + 'px';
      el.style.top = (origTop + dy) + 'px';
    });

    function endDrag(){
      if(!dragging) return;
      dragging = false;
      el.classList.remove('dragging');
      try{ el.releasePointerCapture(pointerId); }catch(err){}
      if(activeDrag && activeDrag.el === el){ activeDrag = null; }
    }
    el.addEventListener('pointerup', endDrag);
    el.addEventListener('pointercancel', endDrag);
    el.addEventListener('lostpointercapture', endDrag);
  }

  // Safety net: if a drag's own pointerup/cancel is ever missed (e.g. released
  // outside the element), force-release capture at the document level so it
  // can never linger and block future clicks elsewhere (like the logo).
  document.addEventListener('pointerup', function(e){
    if(activeDrag && activeDrag.pointerId === e.pointerId){
      var d = activeDrag;
      activeDrag = null;
      d.el.classList.remove('dragging');
      try{ d.el.releasePointerCapture(d.pointerId); }catch(err){}
    }
  }, true);
  document.addEventListener('pointercancel', function(e){
    if(activeDrag && activeDrag.pointerId === e.pointerId){
      var d = activeDrag;
      activeDrag = null;
      d.el.classList.remove('dragging');
      try{ d.el.releasePointerCapture(d.pointerId); }catch(err){}
    }
  }, true);

  function landHouse(house, x){
    var pulse = document.createElement('div');
    pulse.className = 'landing-pulse';
    pulse.style.left = x + 'px';
    scene.appendChild(pulse);
    setTimeout(function(){ pulse.remove(); }, 550);

    propCount++;
    updateStats();

    makeDraggable(house);

    currentNeighborhoodHouses.push(house);
    if(currentNeighborhoodHouses.length >= 10){
      clearIntoNeighborhood();
    }
  }

  function clearIntoNeighborhood(){
    var houses = currentNeighborhoodHouses;
    currentNeighborhoodHouses = [];
    houses.forEach(function(h, i){
      setTimeout(function(){
        h.style.transition = 'transform 0.22s ease, opacity 0.22s ease';
        h.style.transform += ' scale(0.3)';
        h.style.opacity = '0';
        setTimeout(function(){ h.remove(); }, 230);
      }, i * 22);
    });
    setTimeout(buildNeighborhood, houses.length * 22 + 120);
  }

  function buildNeighborhood(){
    neighCount++;
    updateStats();

    var clusterHouses = ['top','left','right','bottom'].map(function(pos, i){
      return '<div class="pos-' + pos + '">' + lineHouseSVG(dotColors[i % dotColors.length]) + '</div>';
    }).join('');

    var topHouses = '', bottomHouses = '';
    for(var i=0;i<3;i++){ topHouses += lineHouseSVG(dotColors[i % dotColors.length]); }
    for(var j=0;j<3;j++){ bottomHouses += lineHouseSVG(dotColors[(j+1) % dotColors.length]); }

    var chip = document.createElement('div');
    chip.className = 'neighborhood';
    chip.innerHTML =
      '<div class="plaza-cluster">' +
        clusterHouses +
        '<div class="plaza">' + plazaSVG() + '</div>' +
      '</div>' +
      '<div class="street-block">' +
        '<div class="houses-side top">' + topHouses + '</div>' +
        roadSVG() +
        '<div class="houses-side bottom">' + bottomHouses + '</div>' +
      '</div>';
    ground.appendChild(chip);
    ground.scrollLeft = ground.scrollWidth;

    unlockNextInstrument();

    currentWorldNeighborhoods.push(chip);
    if(currentWorldNeighborhoods.length >= 10){
      clearIntoWorld();
    }
  }

  function clearIntoWorld(){
    var chips = currentWorldNeighborhoods;
    currentWorldNeighborhoods = [];
    chips.forEach(function(c, i){
      setTimeout(function(){
        c.style.transition = 'transform 0.25s ease, opacity 0.25s ease';
        c.style.transform = 'scale(0.25)';
        c.style.opacity = '0';
        setTimeout(function(){ c.remove(); }, 260);
      }, i * 30);
    });
    setTimeout(buildWorld, chips.length * 30 + 150);
  }

  var infoBackdrop = document.getElementById('infoBackdrop');
  var infoPanel = document.getElementById('infoPanel');
  var infoTitle = document.getElementById('infoTitle');
  var infoText = document.getElementById('infoText');

  var luFacts = [
    'Lu shows up, even on the hard days.',
    'Lu, remember to take care of Lu too.',
    'Lu is sharp and talented, with the instincts of a cat.',
    'Helping people gives Lu strength to keep going.',
    'Lu\u2019s patience is a quiet kind of power.',
    'Keep going, Lu \u2014 the small things add up.',
    'Lu notices what others miss.',
    'Rest is productive too, Lu.',
    'Lu builds trust the slow, honest way.',
    'Lu, you don\u2019t have to carry it all alone.',
    'Every quiet effort counts, Lu.',
    'Lu\u2019s instincts are sharper than Lu gives credit for.',
    'Lu has come further than Lu thinks.',
    'Lu turns care into action, every time.',
    'The world is better with Lu paying attention to it.',
    'Small steps, Lu \u2014 that\u2019s how it\u2019s built.',
    'Lu\u2019s strength is quiet, and it\u2019s real.',
    'Lu, you are exactly who this needed.'
  ];

  function openInfo(n){
    infoTitle.textContent = 'World ' + n;
    infoText.textContent = luFacts[(n - 1) % luFacts.length];
    infoBackdrop.classList.add('show');
    infoPanel.classList.add('show');
  }
  function closeInfo(){
    infoBackdrop.classList.remove('show');
    infoPanel.classList.remove('show');
  }
  infoBackdrop.addEventListener('click', closeInfo);
  document.getElementById('infoClose').addEventListener('click', closeInfo);

  function buildWorld(){
    worldCount++;
    updateStats();

    var myWorldNumber = worldCount;
    var a = document.createElement('a');
    a.className = 'world';
    a.href = '#';
    a.title = 'World ' + myWorldNumber + ' — click for company info';
    a.innerHTML = worldSVG(dotColors[(myWorldNumber - 1) % dotColors.length], myWorldNumber);

    var worldSizes = [46, 52, 58, 50];
    var mySize = worldSizes[(myWorldNumber - 1) % worldSizes.length];
    a.style.width = mySize + 'px';
    a.style.height = mySize + 'px';
    a.style.borderColor = dotColors[(myWorldNumber + 1) % dotColors.length];

    a.addEventListener('click', function(e){
      e.preventDefault();
      a.classList.add('viewed');
      openInfo(myWorldNumber);
    });
    worldCorner.appendChild(a);

    if(myWorldNumber >= 18){
      celebrating = true;
      setTimeout(triggerChaiCelebration, 700);
    }
  }

  var celebrating = false;
  var chaiOverlay = document.getElementById('chaiOverlay');

  function triggerChaiCelebration(){
    closeInfo();
    var worlds = Array.prototype.slice.call(worldCorner.querySelectorAll('.world'));
    var cx = scene.clientWidth / 2;
    var cy = scene.clientHeight / 2;
    var radius = Math.min(230, scene.clientWidth * 0.3, scene.clientHeight * 0.35);

    worlds.forEach(function(w, i){
      var rect = w.getBoundingClientRect();
      var size = rect.width;
      document.body.appendChild(w);
      w.style.position = 'fixed';
      w.style.left = rect.left + 'px';
      w.style.top = rect.top + 'px';
      w.style.right = 'auto';
      w.style.margin = '0';
      w.style.zIndex = 150;
      var angle = (i / worlds.length) * Math.PI * 2;
      var tx = cx + radius * Math.cos(angle) - size / 2;
      var ty = cy + radius * Math.sin(angle) - size / 2;
      requestAnimationFrame(function(){
        w.style.transition = 'left 1.1s cubic-bezier(.4,0,.2,1), top 1.1s cubic-bezier(.4,0,.2,1)';
        w.style.left = tx + 'px';
        w.style.top = ty + 'px';
      });
    });

    chaiOverlay.classList.add('show');

    setTimeout(function(){
      chaiOverlay.classList.remove('show');
      celebrating = false;
      doReset();
    }, 60000);
  }

  logo.addEventListener('pointerdown', function(e){
    try{
      if(celebrating) return;
      e.preventDefault();
      logo.classList.remove('bump');
      void logo.offsetWidth;

      var lw = logo.offsetWidth || 190, lh = logo.offsetHeight || 58;

      logo.classList.add('bump');
      spawnHouse(lx + lw/2 - 27, ly + lh - 20);
    } catch(err){
      console.error('bave: logo click failed', err);
    }
  });

  // ---------- Reset: clears the screen in place, no page reload ----------
  function doReset(){
    document.querySelectorAll('.house, .landing-pulse, .world').forEach(function(el){ el.remove(); });
    ground.innerHTML = '';
    worldCorner.innerHTML = '';
    closeInfo();
    celebrating = false;
    chaiOverlay.classList.remove('show');

    propCount = 0; neighCount = 0; worldCount = 0;
    currentNeighborhoodHouses = [];
    currentWorldNeighborhoods = [];
    updateStats();

    layersEnabled.bass = false;
    layersEnabled.melody = false;
    layersEnabled.shaker = false;
    layersEnabled.bell = false;

    lx = 60; ly = 110;
    dx = speed; dy = speed * 0.7;
    logo.style.transform = 'translate(' + lx + 'px,' + ly + 'px)';
  }
  document.getElementById('resetBtn').addEventListener('click', doReset);

})();
</script>
